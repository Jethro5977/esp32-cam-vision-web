<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>ESP32-CAM · 视觉工作台</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><main><header><p class="eyebrow">ESP32-CAM / VISION WEB</p><h1>看见，再理解。</h1><p class="sub">相机负责拍摄，电脑连接云端 AI。</p><div id="health" role="status">正在探测摄像头…</div><button id="refresh" class="quiet">刷新连接状态</button></header>
<section aria-labelledby="prompt-title"><h2 id="prompt-title">你想了解什么？</h2><div class="presets"><button type="button" data-prompt="描述这张图" aria-pressed="true">描述这张图</button><button type="button" data-prompt="数一数画面里的物品" aria-pressed="false">数一数物品</button><button type="button" data-prompt="读出画面中的文字" aria-pressed="false">读出文字</button><button type="button" data-prompt="判断环境是否整洁" aria-pressed="false">检查整洁度</button></div><label for="prompt">提示词 · 可直接修改</label><textarea id="prompt" maxlength="2000" rows="3">描述这张图</textarea><button id="analyze" class="primary">拍照并识别</button><p class="note">点击后拍摄 ESP32-CAM 面前的场景，并将这张照片发送给 DeepSeek。图片与结果保存在电脑；同一局域网的访问者可查看。</p><p id="progress" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p></section>
<section id="latest-section" hidden><h2>本次结果</h2><div id="latest"></div></section><section><div class="section-head"><h2>最近记录</h2><span>最多 20 条</span></div><p id="history-warning" class="note"></p><div id="history">正在读取历史…</div></section><footer>ESP32 不运行模型 · 电脑是网关<br><a href="/api/stats" target="_blank" rel="noopener">查看实测性能统计 JSON ↗</a></footer></main>
<dialog id="lightbox" aria-label="照片大图"><button id="close-lightbox" autofocus>关闭大图</button><img id="large-image" alt="本次拍摄的大图"></dialog></body></html>
